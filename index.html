<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>阿桑的菜籃攤位幫手</title>
    <style>
        html, body { width: 100%; height: 100%; background-color: #ffd6e0; margin: 0; padding: 0; }
        * { box-sizing: border-box; font-family: "Courier New", Courier, monospace; }
        body { color: #6b4c58; padding: 16px; padding-bottom: 80px; overflow-y: auto; }
        .container { max-width: 480px; margin: 0 auto; }
        .retro-window { background: #ffb3c6; border: 4px solid #ffffff; box-shadow: 6px 6px 0 #e07a94; padding: 8px; margin-bottom: 20px; }
        .window-header { background: #e07a94; color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; margin-bottom: 4px; border-bottom: 2px solid #fff; font-weight: bold; font-size: 14px; }
        .tab-bar { display: flex; border-bottom: 4px solid #e07a94; background: #ffb3c6; }
        .tab-btn { flex: 1; padding: 8px 1px; text-align: center; cursor: pointer; border-right: 2px solid #e07a94; font-size: 10px; font-weight: 900; color: #8c5866; background: #ffb3c6; position: relative; bottom: -4px; }
        .tab-btn.active { background: #ffffff; border-top: 4px solid #e07a94; border-left: 4px solid #e07a94; border-right: 4px solid #e07a94; border-bottom: 4px solid #ffffff; color: #593542; z-index: 1; }
        .window-content { background: #fff; border: 4px solid #fff; border-top: none; padding: 16px; }
        .pixel-text-box { background: #fff0f3; border: 2px solid #e07a94; padding: 12px; margin-top: 12px; font-size: 12px; color: #593542; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .card { background: #fff; padding: 10px; border: 3px solid #e07a94; box-shadow: 4px 4px 0 #e07a94; text-align: center; }
        .income { color: #38b070; font-weight: 900; font-size: 16px; }
        .expense { color: #e06d7d; font-weight: 900; font-size: 16px; }
        .payment-summary-box { background: #fff; border: 3px solid #38b070; padding: 12px; margin-top: 12px; display: flex; justify-content: space-around; font-weight: 900; font-size: 13px; color: #593542; box-shadow: 3px 3px 0 #38b070; }
        .trans-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #e07a94; font-size: 12px; }
        .btn-action { width: 100%; padding: 10px; background: #d6687a; color: #fff; border: 3px solid #fff; cursor: pointer; font-weight: 900; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="retro-window">
            <div class="window-header">♥ 阿桑的菜籃攤位幫手 v1.999</div>
            <div class="tab-bar">
                <div class="tab-btn active" id="tab-btn-start" onclick="switchTab('start')">大廳</div>
                <div class="tab-btn" id="tab-btn-front" onclick="switchTab('front')">收銀</div>
                <div class="tab-btn" id="tab-btn-stock" onclick="switchTab('stock')">商品</div>
                <div class="tab-btn" id="tab-btn-stats" onclick="switchTab('stats')">統計</div>
                <div class="tab-btn" id="tab-btn-history" onclick="switchTab('history')">歷史</div>
            </div>
            <div class="window-content">
                <div id="tab-content-start" class="tab-pane">
                    <div style="text-align:center; font-weight:900; color:#e07a94; font-size:20px;">🍀阿桑加油👏</div>
                    <div class="pixel-text-box">
                        <h3>💰 今日營運概況</h3>
                        <div class="grid-2">
                            <div class="card"><p>總營收</p><p id="start-total-income" class="income">$ 0</p></div>
                            <div class="card"><p>總支出</p><p id="start-total-expense" class="expense">$ 0</p></div>
                        </div>
                    </div>
                    <!-- 新增：統計區塊 -->
                    <div class="payment-summary-box">
                        <div>💵 現金: $<span id="cash-income-display">0</span></div>
                        <div>🟢 LINE Pay: $<span id="linepay-income-display">0</span></div>
                    </div>
                    <div class="pixel-text-box">
                        <h3>💵 零錢箱小幫手</h3>
                        <div id="backup-time-display" style="font-size:10px; color:#d17a94;">上次備份：尚未備份</div>
                    </div>
                </div>
                <div id="tab-content-front" class="tab-pane" style="display:none;">
                    <h2>📋 今日明細紀錄 (最新在最上)</h2>
                    <div id="transaction-list"></div>
                </div>
                <div id="tab-content-stock" class="tab-pane" style="display:none;"></div>
                <div id="tab-content-stats" class="tab-pane" style="display:none;"></div>
                <div id="tab-content-history" class="tab-pane" style="display:none;"></div>
            </div>
        </div>
    </div>
    <script>
        let transactions = JSON.parse(localStorage.getItem('boothData')) || [];
        let currentSession = localStorage.getItem('boothSession') || '';

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(pane => pane.style.display = 'none');
            document.getElementById('tab-btn-' + tabName).classList.add('active');
            document.getElementById('tab-content-' + tabName).style.display = 'block';
        }

        function updateUI() {
            let income = 0, expense = 0, cash = 0, lp = 0;
            transactions.filter(t => t.session === currentSession).forEach(t => {
                if(t.type === 'income') {
                    income += t.amount;
                    if(t.payment === '現金') cash += t.amount;
                    else lp += t.amount;
                } else expense += t.amount;
            });
            document.getElementById('start-total-income').innerText = `$ ${income.toLocaleString()}`;
            document.getElementById('start-total-expense').innerText = `$ ${expense.toLocaleString()}`;
            document.getElementById('cash-income-display').innerText = cash.toLocaleString();
            document.getElementById('linepay-income-display').innerText = lp.toLocaleString();

            const list = document.getElementById('transaction-list');
            list.innerHTML = '';
            // 倒敘排列
            [...transactions.filter(t => t.session === currentSession)].reverse().forEach(t => {
                const div = document.createElement('div');
                div.className = 'trans-item';
                div.innerHTML = `<div>${t.name || '銷售'}</div><div>$${t.amount.toLocaleString()}</div>`;
                list.appendChild(div);
            });
        }
        updateUI();
    </script>
</body>
</html>
